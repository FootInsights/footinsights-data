name: refresh
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_DATASET: footinsights/football-predictions-settled
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET: footinsights/football-predictions-settled
    steps:
      - uses: actions/checkout@v4
      - name: Download the open CSV
        run: |
          curl -fsSL https://footinsights.com/data/predictions.csv -o data/predictions.csv
          test -s data/predictions.csv
      - name: Commit if changed
        run: |
          git config user.name "footinsights-data"
          git config user.email "support@footinsights.com"
          git add data/predictions.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh $(date -u +%F)"
          git push
      # The Kaggle CLI prints server-side errors ("Dataset version creation
      # error: ...") and still exits 0, so the output is checked by hand.
      # A dataset created on the site from a remote URL cannot take files
      # from the API ("Incompatible Dataset Type"); once that one is deleted,
      # the next run recreates the slug as a file dataset and versions it
      # from then on.
      - name: Push to Kaggle
        if: env.KAGGLE_KEY != ''
        run: |
          pip install -q kaggle
          if kaggle datasets status "$KAGGLE_DATASET" >/dev/null 2>&1; then
            out=$(kaggle datasets version -p data -m "refresh $(date -u +%F)" --dir-mode zip 2>&1)
          else
            out=$(kaggle datasets create -p data --public --dir-mode zip 2>&1)
          fi
          echo "$out"
          if echo "$out" | grep -qi "error"; then
            echo "::error::Kaggle rejected the update; see the output above"
            exit 1
          fi
      # The Hub skips a commit when nothing changed, so a quiet week costs
      # nothing. The dataset card lives in hf/README.md.
      - name: Push to Hugging Face
        if: env.HF_TOKEN != ''
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_DATASET"]
          api.create_repo(repo, repo_type="dataset", exist_ok=True)
          api.upload_file(path_or_fileobj="hf/README.md", path_in_repo="README.md",
                          repo_id=repo, repo_type="dataset", commit_message="docs: dataset card")
          api.upload_file(path_or_fileobj="data/predictions.csv", path_in_repo="predictions.csv",
                          repo_id=repo, repo_type="dataset", commit_message="data: weekly refresh")
          print("pushed", api.dataset_info(repo).sha)
          PY
