name: refresh
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_DATASET: footinsights/football-predictions-settled
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET: footinsights/football-predictions-settled
    steps:
      - uses: actions/checkout@v4
      - name: Download the open CSV
        run: |
          curl -fsSL https://footinsights.com/data/predictions.csv -o data/predictions.csv
          test -s data/predictions.csv
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "footinsights-data"
          git config user.email "support@footinsights.com"
          git add data/predictions.csv
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # The Kaggle CLI prints server-side errors ("Dataset version creation
      # error: ...") and still exits 0, so every output is checked by hand.
      # A dataset created on the site from a remote URL cannot take files
      # from the API ("Incompatible Dataset Type"); if the slug is free the
      # run creates it as a file dataset. A new version only when the CSV
      # changed, so a manual run on a quiet day adds no version. The
      # metadata update runs every time: it is what carries the file and
      # column descriptions, the sources, the update frequency and the
      # cover, and it does not create a version. Edits made on kaggle.com
      # are overwritten by it; change data/dataset-metadata.json instead.
      - name: Push to Kaggle
        if: env.KAGGLE_KEY != ''
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          pip install -q kaggle
          check() {
            echo "$1"
            if echo "$1" | grep -qiE "error|invalid"; then
              echo "::error::Kaggle rejected the update; see the output above"
              exit 1
            fi
          }
          if ! kaggle datasets status "$KAGGLE_DATASET" >/dev/null 2>&1; then
            check "$(kaggle datasets create -p data --public --dir-mode zip 2>&1)"
          elif [ "$CHANGED" = "true" ]; then
            check "$(kaggle datasets version -p data -m "refresh $(date -u +%F)" --dir-mode zip 2>&1)"
          else
            echo "CSV unchanged; no new Kaggle version"
          fi
          # The settings endpoint rejects the licence name the create endpoint
          # accepted ("You've specified an invalid license"), so the update
          # carries the licence exactly as the server reports it.
          srv=$(mktemp -d)
          check "$(kaggle datasets metadata "$KAGGLE_DATASET" -p "$srv" 2>&1)"
          python3 - "$srv" <<'PY'
          import json, os, sys
          server = json.load(open(os.path.join(sys.argv[1], "dataset-metadata.json")))
          ours = json.load(open("data/dataset-metadata.json"))
          print("server licences:", server.get("licenses"))
          if server.get("licenses"):
              ours["licenses"] = server["licenses"]
          os.makedirs("meta", exist_ok=True)
          json.dump(ours, open("meta/dataset-metadata.json", "w"))
          PY
          check "$(kaggle datasets metadata --update -p meta "$KAGGLE_DATASET" 2>&1)"
      # The Hub skips a commit when nothing changed, so a quiet week costs
      # nothing. The dataset card lives in hf/README.md.
      - name: Push to Hugging Face
        if: env.HF_TOKEN != ''
        run: |
          pip install -q huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo = os.environ["HF_DATASET"]
          api.create_repo(repo, repo_type="dataset", exist_ok=True)
          api.upload_file(path_or_fileobj="hf/README.md", path_in_repo="README.md",
                          repo_id=repo, repo_type="dataset", commit_message="docs: dataset card")
          api.upload_file(path_or_fileobj="data/predictions.csv", path_in_repo="predictions.csv",
                          repo_id=repo, repo_type="dataset", commit_message="data: weekly refresh")
          print("pushed", api.dataset_info(repo).sha)
          PY
