name: refresh
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the open CSV
        run: |
          curl -fsSL https://footinsights.com/data/predictions.csv -o data/predictions.csv
          test -s data/predictions.csv
      - name: Commit if changed
        run: |
          git config user.name "footinsights-data"
          git config user.email "support@footinsights.com"
          git add data/predictions.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh $(date -u +%F)"
          git push
      - name: Push to Kaggle
        if: env.KAGGLE_KEY != ''
        run: |
          pip install -q kaggle
          kaggle datasets version -p data -m "refresh $(date -u +%F)" --dir-mode zip
