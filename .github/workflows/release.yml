name: release
on:
  schedule:
    - cron: "23 7 1 * *" # the 1st of each month, 07:23 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monthly release (Zenodo mints the DOI from it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m)"
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh release create "$tag" data/predictions.csv \
            --title "FootInsights settled predictions, $(date -u +'%B %Y')" \
            --notes "Every prediction FootInsights published and settled up to $(date -u +%F). CC BY 4.0. Source: https://footinsights.com/data/"
